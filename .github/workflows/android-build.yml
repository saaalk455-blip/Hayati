name: Android Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list contains the obsolete "tools" package, which no longer exists.
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Summarize unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key))
              print(root.get("name"), {k: root.get(k) for k in totals})
          print("TOTAL", totals)
          PY

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Inspect APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK"
          ls -l "$APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable-activity)"
          echo "--- permissions requested (expected: none) ---"
          "$AAPT2" dump permissions "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hayati-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
